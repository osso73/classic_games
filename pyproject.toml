[project]
name = "classic-games"
version = "1.2"
description = "Classic games built with Kivy/KivyMD"
requires-python = ">=3.11,<3.12"
dependencies = [
    "kivy==2.3.1",
    "kivymd==2.0.0",
    "materialyoucolor==3.0.4",
    "pillow==11.3.0",
    "pycairo==1.28.0",
]

[tool.uv]
package = false

[dependency-groups]
android = [
    "appdirs==1.4.4",
    "build==1.2.2.post1",
    "buildozer==1.6.0",
    "colorama==0.4.6",
    "cython==0.29.34",
    "jinja2==3.1.6",
    "meson==1.4.0",
    "ninja==1.11.1.4",
    "packaging==26.3",
    "pip==25.1.1",
    "setuptools==79.0.1",
    "sh==2.2.2",
    "toml==0.10.2",
    "wheel==0.43.0",
]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/mdclassic_games"]
addopts = "--strict-markers"
markers = [
    "gui: requires a working Kivy display and OpenGL context",
]
